name: release

# Builds BOTH of this line's products, and the Linux cross archive, on ubuntu-latest through golang-port's
# build chain (build/port.sh resolves the pinned port). Three entry points:
#   - push to main   : build; if the current upstream (UPSTREAM_VERSION) has no release yet,
#                       auto-cut <upstream>-mavericks.1 (build/version.sh auto -> RELEASE=yes)
#   - a *-mavericks.* tag : publish that exact version
#   - workflow_dispatch with local_release=true : cut a local <upstream>-mavericks.(N+1) repackage
# Products:
#   - native (runs on 10.9): amd64/min-10.9 toolchain + x86_64 Sparkle updater + 10.9.5 floor
#   - cross  (runs on modern macOS, targets 10.9): native arm64 toolchain + arm64 Sparkle updater
#   - go<line>-cross-<version>-linux-x86_64.tar.gz: the linux/amd64 toolchain that targets 10.9, which
#     install@v1 `products:` extracts at /usr/local/mavergreen/go<line>-cross on a Linux runner
# Each pkg is EdDSA-signed with its own feed (go<line>.xml / go<line>-cross.xml), which its updater polls at
# this repo's /releases/latest/download/, so there is no separate feed release. Publishing is the
# shared publish-release.yml, which mints the tag itself (no PAT), refuses an empty Release body and
# writes SHA256SUMS over every asset. Before publish: on-target installs the native pkg on a 10.9 guest
# (Mavergreen/mavericks-vm) and modern-smoke installs the cross pkg on an Apple Silicon runner; both run
# on pull requests too, so a green PR means merging it publishes.


on:
  push:
    branches: [main]          # push to main: build; if upstream has no release yet, cut it
    tags: ['*-mavericks.*']   # a version tag publishes that exact version
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a local -mavericks.(N+1) release for the current upstream version"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver step decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This repo ships ONE line, derived from the root UPSTREAM_VERSION. Decide its version and whether
  # it publishes ONCE here, and let the other jobs read that decision rather than recompute it --
  # they must all agree about what is being built.
  #
  # Deliberately not a matrix. A matrix leg's status context would embed the version ("build (<line>,
  # <x.y.z>-mavericks.N)"), so it would change every release and could never be a required status
  # check -- which is what left every Renovate PR here stuck on "Expected — waiting for status to be
  # reported", unable to merge, for a month, back when lines/ let several lines share a repo. A
  # second line also would have coupled builds: `publish` needs the whole matrix, so a failing line
  # would have blocked a ready one from shipping. A Go minor line is a product, and a product is its
  # own repo -- so this workflow builds the one line this repo has.
  plan:
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.p.outputs.line }}
      version: ${{ steps.p.outputs.version }}
      any_publish: ${{ steps.p.outputs.any_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build/version.sh counts existing <upstream>-mavericks.* tags
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Decide the release plan
        id: p
        run: |
          set -eu
          mode=auto
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
            mode=local
          fi
          # One line, asserted -- not assumed. lines/ is retired: a second line belongs in its own repo.
          [ -f UPSTREAM_VERSION ] || { echo "::error::no UPSTREAM_VERSION at the repo root"; exit 1; }
          [ ! -d lines ] || { echo "::error::lines/ is retired -- a second line belongs in its own repo"; exit 1; }
          line="$(sh build/version.sh line)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag names this line's release; anything else just builds.
            up="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
            case "$GITHUB_REF_NAME" in
              "$up"-mavericks.*) full="$GITHUB_REF_NAME"; rel=yes ;;
              *) full="$(GO_LINE=$line sh build/version.sh auto | sed -n 's/^FULL=//p')"; rel=no ;;
            esac
          else
            out="$(GO_LINE=$line sh build/version.sh "$mode")"
            full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
            rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
            # only main cuts releases; PRs and other branches never publish
            [ "$GITHUB_REF_NAME" = main ] || rel=no
          fi
          echo "line $line -> $full (publish=$rel)"
          { echo "line=$line"; echo "version=$full"; } >> "$GITHUB_OUTPUT"
          if [ "$rel" = yes ]; then echo "any_publish=true" >> "$GITHUB_OUTPUT"; else echo "any_publish=false" >> "$GITHUB_OUTPUT"; fi


  build:
    needs: plan
    runs-on: ubuntu-latest
    env:
      GO_LINE: ${{ needs.plan.outputs.line }}
      # build/port.sh refuses a set GOLANG_PORT_DIR under this: nothing ships from an unpinned port.
      MAVERGREEN_RELEASE: 'yes'
      # Every port step is `LINE_ROOT=<this checkout> sh "$PORT_DIR/build/<step>.sh"`.
      LINE_ROOT: ${{ github.workspace }}
      # A Linux host has no Mach-O reader of its own: the compat guard, conformance and the smokes read
      # binaries with clang22's, which shipyard's scripts take from these.
      LIPO: /usr/local/mavergreen/clang22/bin/llvm-lipo
      OTOOL: /usr/local/mavergreen/clang22/bin/llvm-otool
      NM: /usr/local/mavergreen/clang22/bin/llvm-nm
      STRINGS: /usr/local/mavergreen/clang22/bin/llvm-strings
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build/version.sh counts existing <upstream>-mavericks.* tags

      # The C toolchain is pinned in files, not here, so Renovate bumps one place and the port's
      # c-toolchain.sh checks the installed products against the same files (strictly, since CI=true).
      - name: Read the C toolchain pins
        id: pins
        run: |
          set -eu
          { echo "clang22=$(tr -d '[:space:]' < components/clang22/version)"
            echo "recaulk=$(tr -d '[:space:]' < components/recaulk/version)"; } >> "$GITHUB_OUTPUT"

      - name: Install mavericks-shipyard, clang22 and Recaulk
        # shipyard installs itself via its own action, and `products:` installs each family product at
        # its pin with what it requires (clang22 brings sdk109), at its macOS pkg's prefix under
        # /usr/local/mavergreen, where the port's build scripts look for them on every host.
        uses: Mavergreen/shipyard/.github/actions/install@v1
        with:
          products: clang22@${{ steps.pins.outputs.clang22 }} recaulk@${{ steps.pins.outputs.recaulk }}

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          # the port's build/env.sh puts WORK at $MAVERICKS_BUILD_ROOT/golang-go<line>; its out/ holds every product
          echo "GO_OUT=$RUNNER_TEMP/mm-build/golang-go$GO_LINE/out" >> "$GITHUB_ENV"

      # The plan job already decided this line's version; take it rather than recomputing, so every
      # job in the run agrees about what is being built. VERSION is written locally (never committed)
      # because the port's env.sh and the updater bundle read it.
      - name: Take this line's version from the plan
        id: ver
        run: |
          set -eu
          full="${{ needs.plan.outputs.version }}"
          printf '%s\n' "$full" > VERSION
          { echo "full=$full"; echo "tag=$full"; } >> "$GITHUB_OUTPUT"
          echo "VER=$full" >> "$GITHUB_ENV"
          echo "line=$GO_LINE version=$full"

      - name: Bootstrap Go (linux amd64, >= 1.24)
        uses: actions/setup-go@v7
        with: { go-version: '1.27.x' }

      - name: Hand the bootstrap to the port's builder
        run: echo "GOROOT_BOOTSTRAP=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: pkgsrc rename guard
        run: sh tests/trust/rename-check.sh

      # The shared runner takes the whole top-level suite, so a newly added test runs the day it lands
      # instead of when someone remembers a CI line. Tests needing a built toolchain or a real 10.9 box
      # exit 77 and report SKIP here; the port's trust-static.sh (below) and on-target run the trust tests.
      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      # The pin list the notes describe is derived from the repackage caller's own paths; fail if
      # that declaration resolves to nothing (a typo'd glob means no repackage AND no notes).
      - name: Guard the ingredient pin declaration
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      - name: Resolve the pinned golang-port
        run: |
          set -eu
          PORT_DIR="$(sh build/port.sh)"
          echo "PORT_DIR=$PORT_DIR" >> "$GITHUB_ENV"
          echo "golang-port $(tr -d '[:space:]' < "$PORT_DIR/UPSTREAM_VERSION") at $PORT_DIR"

      # The fast fail for crypto/x509 on darwin: the patched tree must vet and compile its tests for
      # darwin/amd64 before an hour goes into toolchains. cross-vet needs the builder make.bash leaves,
      # which the toolchain builds below reuse; its skip (77) would mean nothing was checked.
      - name: Patched crypto/x509 vets for darwin/amd64
        run: |
          set -eu
          sh "$PORT_DIR/build/build-builder.sh"
          status=0; sh "$PORT_DIR/tests/cross-vet.sh" || status=$?
          [ "$status" -eq 0 ] || { echo "::error::cross-vet.sh exited $status (77, a skip, is a failure here)"; exit 1; }

      - name: Build the native toolchain
        run: sh "$PORT_DIR/build/build-native.sh"

      # The trust checks that need no Mac, on the builder make.bash left: the 10.9 and keychain-union fixes in the
      # source, crypto/x509 for every non-darwin GOOS, and the build-tag-free keychain-union tests. What needs darwin
      # is on-target's. Its skip (77) would mean nothing was checked.
      - name: Trust checks that need no Mac
        run: |
          status=0; sh "$PORT_DIR/tests/trust-static.sh" || status=$?
          [ "$status" -eq 0 ] || { echo "::error::trust-static.sh exited $status (77, a skip, is a failure here)"; exit 1; }

      - name: Build the cross toolchain (darwin/arm64)
        run: sh "$PORT_DIR/build/build-cross.sh"

      - name: Build the Linux cross archive (linux/amd64)
        run: sh "$PORT_DIR/build/build-linux-cross.sh"

      - name: Compat guard on the shipped native toolchain binaries
        run: |
          stage="$MAVERICKS_BUILD_ROOT/golang-go$GO_LINE/staging/usr/local/mavergreen/go$GO_LINE"
          sh "$PORT_DIR/tests/compat-guard.sh" "$stage/bin/go" "$stage/bin/gofmt" "$stage"/pkg/tool/darwin_amd64/*

      - name: Build both Sparkle updaters (Cocoa/ObjC, clang22; must not link Go)
        run: |
          set -eu
          app="$(CMAKE="$(command -v cmake)" sh "$PORT_DIR/build/build-updater.sh" native)"
          xapp="$(CMAKE="$(command -v cmake)" sh "$PORT_DIR/build/build-updater.sh" cross)"
          { echo "UPD_APP_NATIVE=$app"; echo "UPD_APP_CROSS=$xapp"; } >> "$GITHUB_ENV"
          exe="$app/Contents/MacOS/$(basename "$app" .app)"
          "$OTOOL" -L "$exe" > "$RUNNER_TEMP/updater-libs.txt"
          cat "$RUNNER_TEMP/updater-libs.txt"
          ! grep -qi 'usr/local/mavergreen/' "$RUNNER_TEMP/updater-libs.txt" || { echo "::error::updater links the toolchain it updates"; exit 1; }

      # package.sh only warns and packages the toolchain alone when its updater is missing; a release
      # without its updater never updates again, so a missing one stops the build here.
      - name: Package the native and cross .pkgs
        run: |
          set -eu
          for a in "${UPD_APP_NATIVE:-}" "${UPD_APP_CROSS:-}"; do
            [ -n "$a" ] && [ -d "$a" ] || { echo "::error::no updater app at '$a' -- the updater step did not leave one"; exit 1; }
          done
          UPD_APP="$UPD_APP_NATIVE" sh "$PORT_DIR/build/package.sh" native
          UPD_APP="$UPD_APP_CROSS" sh "$PORT_DIR/build/package.sh" cross

      # Review Focus 4: a Linux runner gets this archive from install@v1 `products:`, which runs
      # install-products.sh. So install it exactly that way, from a file:// copy of this release (the
      # archive beside its SHA256SUMS, at the path a GitHub release serves it): the archive's own
      # opt/mavergreen/go<line>-cross/mavergreen.plist marks it and names its requires, and it lands at
      # the cross product's prefix, which its go.env names as CC. Then a cgo and a pure-Go darwin/amd64
      # program must each come out 10.9-stamped with clock_gettime linked in from Recaulk.
      - name: The Linux archive, installed the way install@v1 installs it, builds 10.9 programs
        run: |
          set -eu
          G="/usr/local/mavergreen/go$GO_LINE-cross"
          [ ! -e "$G" ] || { echo "::error::$G already exists, so this would not test the archive"; exit 1; }
          asset="go$GO_LINE-cross-$VER-linux-x86_64.tar.gz"
          rel="$RUNNER_TEMP/releases"
          d="$rel/Mavergreen/$(sh "$SHIPYARD_SCRIPTS/product-name.sh" repo "go$GO_LINE-cross")/releases/download/$VER"
          mkdir -p "$d"
          cp "$GO_OUT/$asset" "$d/"
          ( cd "$d" && sha256sum "$asset" > SHA256SUMS )
          MAVERGREEN_RELEASES="file://$rel" MAVERGREEN_TAR_CACHE="$RUNNER_TEMP/tar-cache" \
            sh "$SHIPYARD_SCRIPTS/install-products.sh" "go$GO_LINE-cross@$VER"
          got="$(sed -n '/<key>version<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$G/mavergreen.plist" | sed -n 1p)"
          [ "$got" = "$VER" ] || { echo "::error::$G/mavergreen.plist says '$got', this run built $VER"; exit 1; }
          sh tests/cross-smoke.sh "$G" /usr/local/mavergreen/clang22/bin

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # The body travels IN the artifact: publish-release.yml does not check out the repo. One call
      # writes the file both sign_and_appcast.sh invocations below (native + cross) and the Release
      # body consume -- the same bytes, so the page and Sparkle's update dialog cannot disagree.
      #
      # --min-os 10.9.5 describes the NATIVE .pkg (the flagship most users install), not the cross
      # variant -- the cross appcast below carries its own real floor (--min-os "$CROSS_MIN_OS") independently.
      #
      # --line wants the upstream tag-glob prefix ("<x.y>"), NOT the product id GO_LINE ("<line>") this
      # job already carries -- GO_LINE names the install prefix (/usr/local/mavergreen/go<line>); it is not the
      # dotted version prefix every "<line>-mavericks.*" tag actually starts with. Passing GO_LINE
      # verbatim here would silently match no tag (none begins with "<line>"), which drops the
      # ingredient section AND the compare link on every future release -- confirmed by generating
      # both ways against this repo's real tags before wiring this in. Derived from VER, which the
      # plan job already resolved for this line.
      - name: Stage release notes
        run: |
          set -eu
          mkdir -p dist
          VER="${{ steps.ver.outputs.full }}"
          LINE="$(printf '%s' "$VER" | cut -d. -f1,2)"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "${{ steps.ver.outputs.tag }}" --version "$VER" \
            --product Go --line "$LINE" --min-os 10.9.5 \
            --out dist/RELEASE_NOTES.md

      - name: EdDSA-sign both .pkgs + generate both Sparkle appcasts
        if: needs.plan.outputs.any_publish == 'true'
        shell: bash   # -eo pipefail: a failing ls must not hand head an empty list
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh` -> needs auth (else 403 rate-limit)
        run: |
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          SH="$SHIPYARD_SCRIPTS"   # exported by install@v1; don't re-derive it from the registry
          [ -d "$SH" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          VER="${{ steps.ver.outputs.full }}"; TAG="${{ steps.ver.outputs.tag }}"
          LINE="${{ needs.plan.outputs.line }}"
          CROSS_MIN_OS="$(sed -n 's/^CROSS_MIN_OS=//p' line.env)"
          [ -n "$CROSS_MIN_OS" ] || { echo "::error::line.env sets no CROSS_MIN_OS"; exit 1; }
          OUT="$GO_OUT"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          NPKG=$(ls "$OUT"/*native*.pkg | head -1)
          TITLE="Mavericks Go $(printf '%s' "$VER" | cut -d. -f1,2)"
          # sign_and_appcast.sh auto-fetches the prebuilt ed25519-sign, signs the pkg, and writes its feed.
          # native -> go$LINE.xml (10.9.5 floor)
          sh "$SH/sign_and_appcast.sh" \
            --channel-title "$TITLE" --version "$VER" \
            --pkg-url "$base/$(basename "$NPKG")" --notes-file dist/RELEASE_NOTES.md \
            --pkg "$NPKG" --min-os 10.9.5 --product "go$LINE" --feed-dir "$OUT"
          XPKG=$(ls "$OUT"/*cross*.pkg | head -1)
          # cross -> go$LINE-cross.xml (modern floor: CROSS_MIN_OS, the toolchain's own linker-stamped floor)
          sh "$SH/sign_and_appcast.sh" \
            --channel-title "$TITLE (cross)" --version "$VER" \
            --pkg-url "$base/$(basename "$XPKG")" --notes-file dist/RELEASE_NOTES.md \
            --pkg "$XPKG" --min-os "$CROSS_MIN_OS" --product "go$LINE-cross" --feed-dir "$OUT"
          echo "=== go$LINE.xml ==="; cat "$OUT/go$LINE.xml"
          echo "=== go$LINE-cross.xml ==="; cat "$OUT/go$LINE-cross.xml"

      - name: Collect artifacts
        run: |
          set -eu
          LINE="${{ needs.plan.outputs.line }}"
          mkdir -p dist
          cp "$GO_OUT"/*.pkg dist/                         # both products' installers
          for f in "go$LINE.xml" "go$LINE-cross.xml"; do [ -f "$GO_OUT/$f" ] && cp "$GO_OUT/$f" dist/ || true; done
          # the Linux cross archive, by the exact name install@v1 `products:` asks SHA256SUMS for
          cp "$GO_OUT/go$LINE-cross-$VER-linux-x86_64.tar.gz" dist/
          # What each variant was built from -- conformance compares them, and a reader can see it.
          for f in build-info-native.txt build-info-cross.txt build-info-linux-cross.txt; do cp "$GO_OUT/$f" dist/; done
          # dist/RELEASE_NOTES.md was already staged above -- the SAME bytes both appcasts used, so
          # the Release page and Sparkle's update dialog cannot tell two different stories.
          ls -l dist

      # SHA256SUMS is written at publish, by publish-release.yml, over exactly what release-assets.sh
      # selects from this artifact. So the archive's place in SHA256SUMS is decided here: release-assets.sh
      # must select it, by its exact name, once. Ungated, so a pull request proves it too.
      - name: The Linux archive is a release asset, once, by its exact name
        run: |
          set -eu
          want="go$GO_LINE-cross-$VER-linux-x86_64.tar.gz"
          assets="$(sh "$SHIPYARD_SCRIPTS/release-assets.sh" dist)"
          n="$(printf '%s\n' "$assets" | sed 's|.*/||' | grep -cxF "$want" || true)"
          [ "$n" = 1 ] || { echo "::error::release-assets.sh selects $want $n times, want once; it selected:"; printf '%s\n' "$assets"; exit 1; }
          echo "ok: $want is selected once, so SHA256SUMS lists it once"

      # Conformance: do the artifacts we are about to publish agree with each other and with the
      # family? Every piece is checked somewhere already -- the compat guard reads binaries,
      # set_install_floor stamps a floor, sign_and_appcast signs -- but nothing asserted they agree.
      # Gated like the signing step: a non-publishing build has no appcast, and this is a question
      # about a release, not about a build.
      - name: Artifact conformance
        if: needs.plan.outputs.any_publish == 'true'
        shell: bash   # -eo pipefail: artifact-facts.sh dying must fail the step, not shorten the stream
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ needs.plan.outputs.version }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
          # Behavior gate, per appcast: a client on this LINE's previous release must SEE this as an
          # upgrade -- a numeric sparkle:version ordering strictly after the last published tag IN THIS
          # LINE. Scope the tag search to the line (e.g. <x.y>.5-mavericks.5 -> glob <x.y>.*) so <x.y>.7
          # compares against <x.y>.5, not a later minor shipped between. Both native + cross carry this VER.
          GLOB="$(printf '%s' "${{ needs.plan.outputs.version }}" | sed 's/-mavericks\..*//' | cut -d. -f1,2).*"
          for a in "go${{ needs.plan.outputs.line }}.xml" "go${{ needs.plan.outputs.line }}-cross.xml"; do
            sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "dist/$a" --version "${{ needs.plan.outputs.version }}" --upstream-glob "$GLOB"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: golang-go${{ needs.plan.outputs.line }}
          path: dist/*

  # The native pkg, installed the way a user installs it, on a real Mac OS X 10.9.5 guest
  # (Mavergreen/mavericks-vm), which has no Command Line Tools. Review Focus 1 first, on the fresh
  # guest: without clang22 the pkg must refuse, naming clang22, and install nothing. Then Longboat's
  # sdk109 and clang22 (which requires it), the pkg, and golang-port's on-target suite against the
  # installed toolchain: the trust tests, the pure-Go and cgo links, no linker warning. A test's 77, its
  # skip, is a failure here. publish waits for it. A fork's pull request gets no secrets, so cannot boot
  # the guest, and never publishes: it skips this.
  on-target:
    needs: [plan, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write   # mavericks-vm's shared image cache
    env:
      GO_LINE: ${{ needs.plan.outputs.line }}
      VER: ${{ needs.plan.outputs.version }}
      MAVERGREEN_RELEASE: 'yes'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      - uses: actions/download-artifact@v8
        with:
          name: golang-go${{ needs.plan.outputs.line }}
          path: ${{ runner.temp }}/dist
      # The guest gets the workspace, not this runner's files: bring in this run's native pkg, clang22's
      # pkg at the line's pin, Longboat at its CI pin (for sdk109, which clang22 requires), and the pinned
      # port's on-target suite. The repo's own tests ran in build; here the 10.9 git is a CLT stub, so
      # port-guards would scan this whole workspace, pkgs and port copy included, rather than the tracked files.
      - name: Bring the pkgs and the port into the workspace
        run: |
          set -eu
          mkdir -p guest
          cp "$RUNNER_TEMP"/dist/golang-*-native-mavericks.*.pkg guest/
          cl="$(tr -d '[:space:]' < components/clang22/version)"
          sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" clang-22 "$cl" "mavericks-clang-22-native-$cl.pkg" guest/clang22
          # Longboat is no ingredient of these pkgs, only how the guest gets sdk109: pinned for CI alone.
          lb="$(tr -d '[:space:]' < components/longboat/version)"
          sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" longboat "$lb" "longboat-$lb.pkg" guest/longboat
          port="$(MAVERICKS_BUILD_ROOT="$RUNNER_TEMP/mm-build" sh build/port.sh)"
          cp -R "$port" guest/port
          ls -lR guest | head -40
      - uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          copyback: false
          debug-on-error: true
          sync-time: true
          envs: 'GO_LINE VER'
          run: |
            set -eu
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            npkg="$(ls guest/golang-*-native-mavericks.*.pkg)"
            # Review Focus 1: no clang22 yet, so the pkg's preinstall must refuse with the sentence shipyard's
            # stage_product.sh writes for a missing require ("<pkg name> needs <short> installed first: <url>
            # -- install it, then run this installer again."; the pkg name is golang-port's package.sh's).
            # The preinstall's stderr goes to /var/log/install.log, so read the lines this attempt added
            # as well as installer's own.
            gominor="$(printf '%s' "$VER" | cut -d. -f1,2)"
            want="Go $gominor for Mavericks needs clang22 installed first: https://github.com/Mavergreen/clang-22/releases/latest -- install it, then run this installer again."
            mark="$(sudo sh -c 'if [ -f /var/log/install.log ]; then wc -l < /var/log/install.log; else echo 0; fi' | tr -d ' ')"
            if out="$(sudo installer -pkg "$npkg" -target / 2>&1)"; then
              printf '%s\n' "$out"; echo "FAIL: the native pkg installed on a guest without clang22"; exit 1
            fi
            log="$(sudo tail -n "+$((mark + 1))" /var/log/install.log 2>/dev/null || true)"
            printf '%s\n%s\n' "$out" "$log" | grep -F "$want" \
              || { printf '%s\n' "$out" "$log" | tail -40; echo "FAIL: the refusal is not: $want"; exit 1; }
            [ ! -e "/usr/local/mavergreen/go$GO_LINE/bin/go" ] || { echo "FAIL: the refused install left go$GO_LINE behind"; exit 1; }
            echo "ok   the native pkg refuses without clang22: $want"
            sudo installer -pkg guest/longboat/longboat-*.pkg -target /
            sudo /usr/local/mavergreen/longboat/bin/longboat sdk install 10.9
            sudo installer -pkg guest/clang22/mavericks-clang-22-native-*.pkg -target /
            sudo installer -pkg "$npkg" -target /
            got="$(sed -n '/<key>version<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "/usr/local/mavergreen/go$GO_LINE/mavergreen.plist" | sed -n 1p)"
            [ "$got" = "$VER" ] || { echo "FAIL: installed go$GO_LINE manifest says '$got', this run built $VER"; exit 1; }
            must() { status=0; "$@" || status=$?; [ "$status" -eq 0 ] || { echo "$* exited $status (77, a skip, is a failure here)"; exit 1; }; }
            must env GO_LINE="$GO_LINE" sh guest/port/tests/on-target/run.sh

  # The cross pkg's arm64 toolchain, installed on Apple Silicon, where its users run it: go runs natively
  # there (no Rosetta), and through clang22-cross it links cgo and pure-Go darwin/amd64 programs stamped
  # 10.9 with clock_gettime from Recaulk (Review Focus 3). Inspected, never run: an x86_64 program runs
  # on 10.9, which on-target covers. One short job; publish waits for it.
  modern-smoke:
    needs: [plan, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    permissions:
      contents: read
    env:
      GO_LINE: ${{ needs.plan.outputs.line }}
      VER: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the clang22 pin
        id: pins
        run: echo "clang22=$(tr -d '[:space:]' < components/clang22/version)" >> "$GITHUB_OUTPUT"
      - name: Install mavericks-shipyard and clang22-cross
        # clang22-cross brings what it requires, sdk109 (by Longboat); the cross pkg needs both.
        uses: Mavergreen/shipyard/.github/actions/install@v1
        with:
          products: clang22-cross@${{ steps.pins.outputs.clang22 }}
      - uses: actions/download-artifact@v8
        with:
          name: golang-go${{ needs.plan.outputs.line }}
          path: dist
      - name: Install this run's cross pkg
        run: sudo installer -pkg "$(ls dist/golang-*-cross-mavericks.*.pkg)" -target /
      - name: go runs natively; 10.9 programs link through the cross toolchain
        run: |
          set -eu
          got="$(sysctl -n hw.optional.arm64 2>/dev/null || echo 0)"
          [ "$got" = 1 ] || { echo "::error::hw.optional.arm64 is $got: this runner is not Apple Silicon"; exit 1; }
          G="/usr/local/mavergreen/go$GO_LINE-cross"
          CL=/usr/local/mavergreen/clang22-cross/bin
          m="$(sed -n '/<key>version<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$G/mavergreen.plist" | sed -n 1p)"
          [ "$m" = "$VER" ] || { echo "::error::installed go$GO_LINE-cross manifest says '$m', this run built $VER"; exit 1; }
          a="$("$CL/llvm-lipo" -archs "$G/bin/go" | tr -d "[:space:]")"   # llvm-lipo ends the list with a space
          [ "$a" = arm64 ] || { echo "::error::$G/bin/go is '$a', want arm64 only"; exit 1; }
          v="$("$G/bin/go" version)"
          echo "$v"
          case "$v" in *" darwin/arm64") ;; *) echo "::error::go version should end darwin/arm64: $v"; exit 1 ;; esac
          sh tests/cross-smoke.sh "$G" "$CL"

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read). One artifact holds
  # both signed products (native + cross .pkg and both feeds) and the Linux archive, so one scan covers
  # everything publish attaches.
  scan:
    needs: [plan, build]
    if: always() && (needs.plan.outputs.any_publish == 'true')   # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: golang-go${{ needs.plan.outputs.line }}
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [plan, build, scan, on-target, modern-smoke]
    if: needs.plan.outputs.any_publish == 'true'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.plan.outputs.version }}
      artifact: golang-go${{ needs.plan.outputs.line }}

  required:
    name: required (release)
    if: always()
    needs: [plan, build, on-target, modern-smoke, scan, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
